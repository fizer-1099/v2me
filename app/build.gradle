plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.v2rayconfig'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.v2rayconfig"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.3'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // Core tunneling engine (wraps Xray-core for Android).
    // Source: https://github.com/2dust/AndroidLibXrayLite
    // Pinned to a real, immutable release tag instead of "main-SNAPSHOT" —
    // a floating/dynamic version was the actual cause of the "Cannot mutate
    // the dependencies of configuration ... after the configuration was
    // resolved" build failure. If this tag is old by the time you read
    // this, check https://github.com/2dust/AndroidLibXrayLite/releases
    // for the current latest tag and swap it in below.
    implementation 'com.github.2dust:AndroidLibXrayLite:v26.5.9'

    implementation 'com.google.code.gson:gson:2.10.1'
}
